<style>
/* Layout: one tabbed column, same bones as the original tracker. Dusk-plum slate with a lilac accent; priority colours are rose, amber, teal. A single dark look by choice. */
:root{
  --bg:#0c0b12; --surface:#14131c; --raise:#1b1a27; --line:#2d2b3d; --line-soft:#201f2d;
  --fg:#ece9f3; --mut:#9a96ad; --accent:#c0aef0; --accent-ink:#151024;
  --crit:#ec8f98; --imp:#e6b25f; --flex:#7fd0bf; --late:#e6b25f; --miss:#ec8f98; --ok:#7fd0bf;
  --h0:#1d1c2a; --h1:#2b2a47; --h2:#433f77; --h3:#6c62b4; --h4:#c0aef0;
  --display:'Playfair Display',Georgia,serif; --body:'Source Sans 3',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:inherit}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}
.top{display:flex;flex-wrap:wrap;gap:14px 24px;justify-content:space-between;align-items:flex-end}
.lockup{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.98;font-size:clamp(28px,5.4vw,48px);letter-spacing:.005em}
.lockup span{display:block;color:#8d86b4}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--mono);font-size:12.5px}
.pill{border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--mut);background:var(--surface);white-space:nowrap}
.pill b{color:var(--fg);font-weight:500}
main{display:flex;flex-direction:column;gap:18px;min-width:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 16px;color:var(--mut);font-weight:600;white-space:nowrap;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab:hover{color:var(--fg)}
.hero{background:var(--raise);border:1px solid var(--line);border-radius:16px;padding:22px 24px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.hero p{font-family:var(--display);font-style:italic;font-weight:700;font-size:clamp(20px,3.2vw,28px);line-height:1.25;max-width:42ch;text-wrap:balance}
.lab{display:block;font-family:var(--mono);font-style:normal;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-bottom:8px;font-weight:400}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--fg)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{border-color:var(--miss);color:var(--miss)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:14px 16px;min-width:0}
.stat .k{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.stat .v{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.1;margin-top:4px}
.stat .v small{font-family:var(--body);font-weight:400;font-size:16px;color:var(--mut)}
.stat .s{font-size:13.5px;color:var(--mut);margin-top:2px}
.daynav{display:flex;flex-wrap:wrap;align-items:center;gap:10px}

.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn[disabled]{opacity:.35;cursor:not-allowed}
.bar{height:6px;border-radius:99px;background:var(--h0);overflow:hidden}

.panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;padding:6px}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;padding:18px 20px;min-width:0}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.grid2.wide{grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr))}
.twocol{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
.note{font-size:14px;color:var(--mut);margin:6px 0 0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.flabel{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
select,input[type=date],input[type=text],input[type=time],input[type=number],input[type=password],textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color-scheme:dark;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
.frow{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.frow>.field{flex:1 1 140px}
.chip{font-family:var(--mono);font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:3px 11px;background:transparent;color:var(--mut);white-space:nowrap}
.chip.ok{color:var(--accent);border-color:rgba(192,174,240,.45)}
.chip.late{color:var(--late);border-color:rgba(230,178,95,.5)}
.chip.miss{color:var(--miss);border-color:rgba(236,143,152,.5)}
button.chip:hover{border-color:var(--fg)}
.chk{appearance:none;-webkit-appearance:none;width:28px;height:28px;border-radius:8px;border:2px solid #655f82;background:transparent;cursor:pointer;margin:0;display:grid;place-items:center;flex:none}
.chk:checked{background:var(--accent);border-color:var(--accent);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23151024' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12.5l4.5 4.5L19 7.5'/></svg>");background-size:20px;background-position:center;background-repeat:no-repeat}
.chk:disabled{opacity:.35;cursor:not-allowed}
.switch{display:flex;gap:12px;align-items:flex-start}
.switch input{width:20px;height:20px;accent-color:var(--accent);margin-top:3px;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--surface);border:0;padding:8px 14px;font-weight:600;font-size:14px;color:var(--mut)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.pri button[aria-pressed="true"][data-v="critical"]{background:var(--crit);color:#2a0f14}
.seg.pri button[aria-pressed="true"][data-v="important"]{background:var(--imp);color:#2a1d05}
.seg.pri button[aria-pressed="true"][data-v="flexible"]{background:var(--flex);color:#06231d}
.row{display:grid;grid-template-columns:11.6rem minmax(0,1fr) auto 30px;gap:6px 14px;align-items:center;padding:13px 14px;border-radius:12px;position:relative}
.row+.row{border-top:1px solid var(--line-soft)}
.row .time{font-family:var(--mono);font-size:13px;color:var(--mut)}
.row .name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.row.now{background:rgba(192,174,240,.11);box-shadow:inset 0 0 0 1px var(--accent)}
.row.now .time{color:var(--fg)}
.row.coach .name::after{content:"coaching";margin-left:10px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--imp);border:1px solid rgba(230,178,95,.5);border-radius:6px;padding:1px 6px}
.nowtag{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-left:10px;font-weight:500}
.nowtag::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(192,174,240,.75)}100%{box-shadow:0 0 0 12px rgba(192,174,240,0)}}
.pgroup{display:flex;flex-direction:column;gap:10px}
.pgroup h3{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:19px}
.pgroup h3 .cnt{font-family:var(--mono);font-size:12px;font-weight:400;color:var(--mut)}
.pdot{width:12px;height:12px;border-radius:4px;flex:none}
.pdot.critical{background:var(--crit)} .pdot.important{background:var(--imp)} .pdot.flexible{background:var(--flex)}
.task{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:6px 14px;align-items:start;padding:13px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line-soft);border-left-width:4px}
.task.critical{border-left-color:var(--crit)} .task.important{border-left-color:var(--imp)} .task.flexible{border-left-color:var(--flex)}
.task.done .tt{text-decoration:line-through;color:var(--mut)}
.task .tt{font-weight:600;overflow-wrap:anywhere}
.task .tn{font-size:14px;color:var(--mut);margin-top:2px;overflow-wrap:anywhere}
.task .tm{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.task .ta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.task.crit-on{background:linear-gradient(90deg,rgba(236,143,152,.07),transparent 40%),var(--surface)}
.empty{border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--mut);font-size:14.5px}
.med{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:12px 14px}
.med+.med{border-top:1px solid var(--line-soft)}
.med .mn{font-weight:600}
.counter{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.counter .n{font-family:var(--display);font-weight:800;font-size:44px;line-height:1}
.plan{background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.plan h3{font-family:var(--display);font-weight:800;font-size:21px;overflow-wrap:anywhere}
.sect{border-top:1px solid var(--line-soft);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.sect h4{margin:0;font-weight:700;font-size:16px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.item{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:4px 0}
.item .chk{width:24px;height:24px;border-radius:7px}
.item.done .it{text-decoration:line-through;color:var(--mut)}
.item .it{overflow-wrap:anywhere}
.inl{display:flex;gap:8px}
.inl input{flex:1}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.badge{border:1px solid var(--line-soft);border-radius:14px;padding:14px 16px;background:var(--surface);min-width:0}
.badge.on{border-color:rgba(192,174,240,.55);background:var(--raise)}
.badge b{display:block;font-family:var(--display);font-weight:800;font-size:18px}
.badge .d{font-size:14px;color:var(--mut);margin:2px 0 8px}
.badge.off b,.badge.off .d{opacity:.72}
.rankhero{background:var(--raise);border:1px solid var(--line);border-radius:18px;padding:26px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px 32px;align-items:center}
.rname{font-family:var(--display);font-weight:900;font-size:clamp(34px,6vw,58px);line-height:1;text-transform:uppercase;margin:8px 0 6px;overflow-wrap:anywhere}
.rtag{font-family:var(--display);font-style:italic;font-weight:700;font-size:20px;color:var(--mut)}
.rxp .big{font-size:34px;font-weight:500}
.rxp .bar{margin:10px 0 6px}
.ladder{list-style:none;margin:0;padding:0}
.lrow{display:grid;grid-template-columns:2rem minmax(0,1fr) 6rem 9.5rem;gap:6px 14px;align-items:center;padding:12px 14px;border-radius:12px}
.lrow+.lrow{border-top:1px solid var(--line-soft)}
.lrow .li{font-family:var(--mono);color:var(--mut)}
.lrow .xpn{font-family:var(--mono);font-size:13.5px;text-align:right}
.lrow.cur{background:rgba(192,174,240,.11);box-shadow:inset 0 0 0 1px var(--accent)}
.lrow.lock .nm{opacity:.55}
.lrow .st{justify-self:end}
.hbar{display:grid;grid-template-columns:8.4rem minmax(0,1fr) 3.6rem;gap:12px;align-items:center;padding:6px 0;font-size:14.5px}
.hbar .t{height:10px;background:var(--h0);border-radius:99px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hbar .t i.warn{background:var(--late)}
.hbar .n{font-family:var(--mono);font-size:13px;text-align:right}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line-soft);font-size:15px}
.kv:first-of-type{border-top:0}
.kv span:last-child{font-family:var(--mono);text-align:right}
svg text{fill:var(--mut);font-family:var(--mono);font-size:11px}
svg .gl{stroke:var(--line);stroke-width:1}
svg .b{fill:var(--accent)} svg .b.m{fill:var(--late)} svg .b.u{fill:#4a4763} svg .b.c{fill:var(--crit)} svg .b.f{fill:var(--flex)} svg .b.i{fill:var(--imp)}
svg .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
svg .dot{fill:var(--accent)}
svg .val{fill:var(--fg)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.trend{font-family:var(--mono);font-size:12.5px;color:var(--mut)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:13.5px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line-soft);white-space:nowrap}
th{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:400}
td.t{font-family:var(--mono)}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:30;max-width:90vw}
.alerts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:40;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.alert{pointer-events:auto;width:min(520px,100%);background:var(--raise);border:1px solid var(--accent);border-radius:14px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.alert b{display:block}
.alert .am{min-width:0;flex:1 1 200px}
.alert .aa{display:flex;gap:6px;flex-wrap:wrap}
.gate{min-height:calc(100vh - 120px);display:grid;place-items:center}
.gatecard{width:min(560px,100%);display:flex;flex-direction:column;gap:18px}
.gatecard .lockup{font-size:clamp(40px,10vw,76px)}
.gatecard p.lead{font-family:var(--display);font-style:italic;font-weight:700;font-size:22px;color:var(--mut);text-wrap:balance}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:99px;background:var(--h0)}
.steps i.on{background:var(--accent)}
.blk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 14px}
.blk+.blk{border-top:1px solid var(--line-soft)}
.daychips{display:flex;gap:4px;flex-wrap:wrap}
.daychips button{width:34px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:12px;color:var(--mut);padding:0}
.daychips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.lock-note{display:flex;gap:10px;align-items:flex-start;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14.5px;color:var(--mut)}
@media (max-width:760px){
  .twocol,.rankhero{grid-template-columns:minmax(0,1fr)}
  .row{grid-template-columns:minmax(0,1fr) 30px;grid-template-areas:"time chk" "name name" "status status"}

  .lrow{grid-template-columns:1.6rem minmax(0,1fr) auto;grid-template-areas:"i n s" ". x x"}.lrow .li{grid-area:i}.lrow .nm{grid-area:n}.lrow .st{grid-area:s}.lrow .xpn{grid-area:x;text-align:left}
  .hbar{grid-template-columns:6.4rem minmax(0,1fr) 3.4rem}
}
@media (prefers-reduced-motion:reduce){.nowtag::before{animation:none}}

<script>
(function () {
'use strict';

/* ---------- helpers ---------- */
function pad(n){return String(n).padStart(2,'0');}
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseKey(k){var p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function addDays(k,n){var d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d);}
function todayKey(){return keyOf(new Date());}
function nowMins(){var d=new Date();return d.getHours()*60+d.getMinutes();}
function range(a,b){var out=[],k=a,g=0;while(k<=b&&g++<800){out.push(k);k=addDays(k,1);}return out;}
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dayLabel(k){var d=parseKey(k);return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()];}
function fmt12(m){var h=Math.floor(m/60)%24,mm=m%60;return (h%12||12)+':'+pad(mm)+' '+(h>=12?'pm':'am');}
function hhmm(m){return pad(Math.floor(m/60)%24)+':'+pad(m%60);}
function toMin(s){var p=/^(\d{1,2}):(\d{2})$/.exec(s||'');return p?(+p[1])*60+(+p[2]):null;}
function minsOf(iso){var d=new Date(iso);return d.getHours()*60+d.getMinutes();}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function clone(o){return JSON.parse(JSON.stringify(o));}
function plural(n,a,b){return n===1?a:b;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

function flush(){
  if(!dbc)return;
  Object.keys(pending).forEach(function(id){
    if(inflight[id])return;delete pending[id];inflight[id]=true;
    dbc.collection('data/users/'+myId).doc(id).set(clone(cache[id])).then(function(){inflight[id]=false;if(pending[id])flush();},function(){inflight[id]=false;sync='error';renderMeta();});

}

  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(LSP)===0){var id=k.slice(LSP.length);if(DOCIDS.test(id))cache[id]=JSON.parse(localStorage.getItem(k));}}}catch(e){}
}
function initDb(){
  if(!window.claude||!window.claude.use)return;
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0],u=r[1];if(!db||!u)return;
    userCap=u;
    return Promise.resolve(u.id()).then(function(id){
      myId=String(id);dbc=db;var migrated=false;
      db.collection('data/users/'+myId).onSnapshot(function(snap){
        var remote={};snap.docs.forEach(function(x){if(DOCIDS.test(x.id))remote[x.id]=x.data();});
        if(!snap.metadata.fromCache&&!migrated){migrated=true;
          Object.keys(cache).forEach(function(id){if(!remote[id]){pending[id]=true;}});flush();}
        Object.keys(remote).forEach(function(id){if(!pending[id]&&!inflight[id]){cache[id]=remote[id];lsSet(id,remote[id]);}});
        ver++;sync='db';route();softRender();
      },function(){sync='local';renderMeta();});

}

/* ---------- points ---------- */
var memo={v:-1,all:null};
function planDoneMap(){var m={};plans().forEach(function(p){p.sections.forEach(function(s){s.items.forEach(function(i){if(i.done&&i.at){var k=keyOf(new Date(i.at));m[k]=(m[k]||0)+1;}});});});return m;}
function weightDays(){var m={};Object.keys(weights()).forEach(function(w){var e=weights()[w];if(e&&e.date)m[e.date]=1;});return m;}
function dayBase(k,pd,wd){
  var d=peek(k),r={task:0,bonus:0,routine:0,plan:0,health:0,showed:0,sweep:0,streak:0,total:0,active:false};
  var crit=d.tasks.filter(function(t){return t.p==='critical';});
  d.tasks.forEach(function(t){if(t.done){r.task+=PRI[t.p].pts;var due=toMin(t.due);if(due!=null&&t.at&&keyOf(new Date(t.at))===k&&minsOf(t.at)<=due)r.bonus+=5;}});
  if(crit.length&&crit.every(function(t){return t.done;}))r.sweep=15;
  var bl=Object.keys(d.blk);bl.forEach(function(id){r.routine+=id==='coaching'?8:4;});
  r.plan=8*(pd[k]||0);
  var nd=Object.keys(d.doses).length;r.health=Math.min(5,nd)*3+(d.checkin?5:0)+(wd[k]?15:0);
  r.active=d.tasks.some(function(t){return t.done;})||bl.length>0||nd>0||!!d.checkin||!!pd[k]||!!wd[k];
  r.showed=r.active?10:0;
  r.total=r.task+r.bonus+r.routine+r.plan+r.health+r.showed+r.sweep;return r;
}
function pointsAll(){
  if(memo.v===ver)return memo.all;
  var pd=planDoneMap(),wd=weightDays(),t=todayKey(),set={};
  dayKeys().forEach(function(k){set[k]=1;});Object.keys(pd).forEach(function(k){set[k]=1;});Object.keys(wd).forEach(function(k){set[k]=1;});
  var ks=Object.keys(set).sort(),by={},total=0,run=0,gap=0,best=0;
  if(ks.length){range(ks[0],t).forEach(function(k){
    var r=dayBase(k,pd,wd);
    if(r.active){run++;gap=0;if(run>best)best=run;r.streak=Math.min(10,2*(run-1));}
    else if(k!==t){gap++;if(gap>=2)run=0;}
    r.total+=r.streak;total+=r.total;by[k]=r;});}
  var all={by:by,total:total,streak:{cur:run,best:best}};memo={v:ver,all:all};return all;
}
function dayPts(k){var r=pointsAll().by[k];return r?r.total:0;}
function levelOf(p){var i=0;for(var j=0;j<LEVELS.length;j++){if(p>=LEVELS[j][0])i=j;}return {idx:i,name:LEVELS[i][1],tag:LEVELS[i][2],next:LEVELS[i+1]||null};}
function weekKeys(offset){var t=todayKey(),m=addDays(weekKey(t),-7*(offset||0));return range(m,addDays(m,6));}
function ptsOf(keys){return keys.reduce(function(a,k){return a+dayPts(k);},0);}
function withLevel(fn){var b=levelOf(pointsAll().total).idx;fn();var a=levelOf(pointsAll().total);if(a.idx>b)toast('New level: '+a.name+'. '+a.tag);}

/* ---------- statistics ---------- */
function buckets(period){
  var t=todayKey(),out=[],i;
  if(period==='day'){for(i=13;i>=0;i--){var k=addDays(t,-i);out.push({l:String(parseKey(k).getDate()),l2:DOW[parseKey(k).getDay()].charAt(0),keys:[k]});}}
  else if(period==='week'){var m=weekKey(t);for(i=7;i>=0;i--){var s=addDays(m,-7*i),sd=parseKey(s);out.push({l:sd.getDate()+' '+MON[sd.getMonth()],l2:'',keys:range(s,addDays(s,6)).filter(function(x){return x<=t;})});}}
  else{var d=parseKey(t);for(i=5;i>=0;i--){var x=new Date(d.getFullYear(),d.getMonth()-i,1),a=keyOf(x),e=keyOf(new Date(x.getFullYear(),x.getMonth()+1,0));out.push({l:MON[x.getMonth()],l2:'',keys:range(a,e<=t?e:t)});}}
  return out;
}
function medStat(keys){
  var t=todayKey(),nm=nowMins(),taken=0,missed=0,exp=0;
  keys.forEach(function(k){if(k>t)return;var d=peek(k);dosesFor(k).forEach(function(x){
    var rec=d.doses[x.key];
    if(k===t&&x.m>nm&&!rec)return;
    exp++;if(rec&&rec.s==='taken')taken++;else if(rec&&rec.s==='missed')missed++;});});
  return {taken:taken,missed:missed,unlogged:Math.max(0,exp-taken-missed),exp:exp};
}
function taskStat(keys){var done=0,total=0,by={critical:[0,0],important:[0,0],flexible:[0,0]};
  keys.forEach(function(k){peek(k).tasks.forEach(function(t){total++;by[t.p][1]++;if(t.done){done++;by[t.p][0]++;}});});return {done:done,total:total,by:by};}

function activeStat(keys){var by=pointsAll().by;return keys.filter(function(k){return by[k]&&by[k].active;}).length;}

var firedKey=function(){return 'fired-'+todayKey();};
var snoozed={};
function dueItems(){
  var t=todayKey(),nm=nowMins(),p=profile(),n=p.notif,d=peek(t),out=[];
  if(n.meds)dosesFor(t).forEach(function(x){if(!d.doses[x.key])out.push({id:'m'+x.key,at:x.m,title:'Time for '+x.med.name,body:'Scheduled for '+fmt12(x.m)+'.',med:x.key});});

    else if(!b.coach&&n.routine&&b.remind)out.push({id:'b'+b.id,at:b.s-n.lead,title:b.name,body:'Starts at '+fmt12(b.s)+'.'});});

}
function tickAlerts(){
  if(ui.stage!=='app'||ui.ownerOnly)return;
  var nm=nowMins(),fk=firedKey(),fired=lsGet(fk)||{},changed=false,now=Date.now();
  dueItems().forEach(function(it){
    var sn=snoozed[it.id];
    if(sn){if(now<sn)return;delete snoozed[it.id];delete fired[it.id];}
    if(fired[it.id])return;
    if(nm>=it.at&&nm<=it.at+45){
      fired[it.id]=1;changed=true;alerts.push(it);
      try{if(profile().notif.browser&&window.Notification&&Notification.permission==='granted')new Notification(it.title,{body:it.body});}catch(e){}
    }

/* ---------- charts ---------- */
function niceMax(m){return m<=4?4:m<=10?Math.ceil(m/2)*2:m<=100?Math.ceil(m/10)*10:Math.ceil(m/50)*50;}
function stackChart(items,opt){
  opt=opt||{};var W=700,H=opt.h||220,L=38,T=18,B=items.some(function(i){return i.l2;})?42:30,R=6,pw=W-L-R,ph=H-T-B,n=items.length,bw=Math.min(54,pw/n*.62),svg='';
  var tot=function(i){return i.segs.reduce(function(a,s){return a+s[0];},0);};
  var top=opt.max||niceMax(Math.max.apply(null,items.map(tot).concat([1])));
  [0,top/2,top].forEach(function(v){var y=T+ph-ph*v/top;svg+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+(opt.unit?Math.round(v)+opt.unit:Math.round(v*10)/10)+'</text>';});
  items.forEach(function(it,i){
    var x=L+pw/n*i+(pw/n-bw)/2,yy=T+ph,sum=tot(it);
    it.segs.forEach(function(s){if(s[0]<=0)return;var h=ph*s[0]/top;yy-=h;svg+='<rect class="b '+(s[1]||'')+'" x="'+x+'" y="'+yy+'" width="'+bw+'" height="'+h+'" rx="3"/>';});
    if(sum>0&&opt.labels!==false)svg+='<text class="val" x="'+(x+bw/2)+'" y="'+(yy-5)+'" text-anchor="middle">'+(opt.label?opt.label(it):Math.round(sum*10)/10)+'</text>';
    svg+='<text x="'+(x+bw/2)+'" y="'+(H-(it.l2?16:8))+'" text-anchor="middle">'+esc(it.l)+'</text>'+(it.l2?'<text x="'+(x+bw/2)+'" y="'+(H-3)+'" text-anchor="middle">'+esc(it.l2)+'</text>':'');
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+esc(opt.aria||'Chart')+'">'+svg+'</svg>';
}
function lineChart(pts,opt){
  opt=opt||{};if(!pts.length)return '';var W=700,H=230,L=44,T=20,B=34,R=14,pw=W-L-R,ph=H-T-B,svg='';
  var ys=pts.map(function(p){return p.y;}),lo=Math.floor(Math.min.apply(null,ys)-1),hi=Math.ceil(Math.max.apply(null,ys)+1),
      t0=pts[0].t,t1=pts[pts.length-1].t,xs=function(t){return pts.length===1||t1===t0?L+pw/2:L+pw*(t-t0)/(t1-t0);},yv=function(v){return T+ph-ph*(v-lo)/(hi-lo);};
  [lo,(lo+hi)/2,hi].forEach(function(v){var y=yv(v);svg+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+(Math.round(v*10)/10)+'</text>';});
  if(pts.length>1)svg+='<polyline class="ln" points="'+pts.map(function(p){return xs(p.t)+','+yv(p.y);}).join(' ')+'"/>';
  pts.forEach(function(p,i){var x=xs(p.t),y=yv(p.y);svg+='<circle class="dot" cx="'+x+'" cy="'+y+'" r="4.5"/>';
    if(pts.length<=12)svg+='<text class="val" x="'+x+'" y="'+(y-10)+'" text-anchor="middle">'+p.y+'</text>';
    if(i===0||i===pts.length-1||pts.length<=6)svg+='<text x="'+x+'" y="'+(H-10)+'" text-anchor="'+(i===0&&pts.length>1?'start':i===pts.length-1&&pts.length>1?'end':'middle')+'">'+esc(p.l)+'</text>';});
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+esc(opt.aria||'Line chart')+'">'+svg+'</svg>';
}
function legend(a){return '<div class="legend">'+a.map(function(x){return '<span><i class="b '+x[1]+'" style="background:'+x[2]+'"></i>'+esc(x[0])+'</span>';}).join('')+'</div>';}

  dayKeys().forEach(function(k){var d=peek(k);d.tasks.forEach(function(x){if(x.done){tasks++;if(x.p==='critical')crit++;}});blocks+=Object.keys(d.blk).length;doses+=Object.keys(d.doses).length;});
  ks.forEach(function(k){if(by[k].sweep)sweeps++;});plans().forEach(function(p){p.sections.forEach(function(s){s.items.forEach(function(i){if(i.done)plansDone++;});});});
  var wl=Object.keys(weights()).length,ci=dayKeys().filter(function(k){return peek(k).checkin;}).length;
  function B(t,d,v,g,u){return {t:t,d:d,v:v,g:g,u:u||''};}
  return [B('First step','Complete one task.',tasks,1),B('Ten done','Complete 10 tasks.',tasks,10),B('Getting things done','Complete 50 tasks.',tasks,50),B('Non-negotiable','Finish 5 Critical tasks.',crit,5),
    B('Clean sweep','Finish every Critical task in a day, 3 times.',sweeps,3,' days'),B('Showing up','Be active on 7 days.',ks.filter(function(k){return by[k].active;}).length,7,' days'),B('Three days running','Reach a 3-day streak.',pa.streak.best,3,' days'),B('A full week','Reach a 7-day streak.',pa.streak.best,7,' days'),
    B('In rhythm','Tick 30 routine blocks.',blocks,30),B('Plan in motion','Tick 10 plan tasks.',plansDone,10),B('Taking care','Record 20 medicine doses.',doses,20),B('Check-in habit','Do 7 daily check-ins.',ci,7),B('Steady weigh-ins','Log weight in 4 different weeks.',wl,4,' weeks'),B('500 points','Earn 500 points.',pa.total,500,' pts'),B('2,000 points','Earn 2,000 points.',pa.total,2000,' pts')];
}

  var tot={task:0,bonus:0,routine:0,plan:0,health:0,showed:0,sweep:0,streak:0};Object.keys(pa.by).forEach(function(k){Object.keys(tot).forEach(function(f){tot[f]+=pa.by[k][f];});});
  var rows=[['Tasks','10 to 30 by priority',tot.task],['On-time bonus','+5 before a deadline',tot.bonus],['Critical sweep','+15 all Critical done',tot.sweep],['Routine','+4 a block, +8 coaching',tot.routine],['Plan tasks','+8 each',tot.plan],['Health logging','+3 a dose, +5 check-in, +15 weight',tot.health],['Showing up','+10 on any active day',tot.showed],['Streak bonus','up to +10 a day',tot.streak]],mx=Math.max.apply(null,rows.map(function(r){return r[2];}).concat([1]));
  h+='<section class="card"><h3>Where your points came from</h3>'+rows.map(function(r){return '<div class="hbar" title="'+esc(r[1])+'" style="grid-template-columns:8.4rem minmax(0,1fr) 3.6rem"><span>'+esc(r[0])+'</span><div class="t"><i style="width:'+Math.round(100*r[2]/mx)+'%"></i></div><span class="n">'+r[2]+'</span></div>';}).join('')+'<p class="note">Hover a row for the rule.</p></section></div>';
  h+='<section class="card"><h3>How points work</h3><p style="font-size:15px;color:var(--mut)">Points reward effort and showing up. You never lose points. A missed task, a skipped day or a hard health day takes nothing away, and one rest day never breaks your streak. Health points come only from logging doses, checking in and weighing in. They never depend on the numbers themselves, and logging a headache or a panic attack earns nothing.</p></section>';
  h+='<section class="card"><h3>The ladder</h3><ul class="ladder">'+LEVELS.map(function(r,i){var cur=i===lv.idx,got=i<=lv.idx;return '<li class="lrow'+(cur?' cur':got?'':' lock')+'"><span class="li">'+(i+1)+'</span><span class="nm"><b>'+esc(r[1])+'</b><br><span class="mut" style="font-size:13.5px">'+esc(r[2])+'</span></span><span class="xpn">'+r[0].toLocaleString()+' pts</span><span class="st">'+(cur?'<span class="chip ok">you are here</span>':got?'<span class="chip">reached</span>':'<span class="chip">'+(r[0]-pa.total).toLocaleString()+' to go</span>')+'</span></li>';}).join('')+'</ul></section>';

  var bestDay=0,bk=null;Object.keys(pa.by).forEach(function(k){if(pa.by[k].total>bestDay){bestDay=pa.by[k].total;bk=k;}});

  return h;
}

    '<div class="field"><label for="pw-in">Password</label><input type="password" id="pw-in" autocomplete="current-password"></div>'+(ui.pwErr?'<p style="color:var(--miss)">'+esc(ui.pwErr)+'</p>':'')+

    '<p class="note">'+(ui.confirm==='reset'?'This clears the password so you can set a new one. Your data stays. <button class="btn sm warn" data-act="resetPw">Yes, reset it</button> <button class="btn sm" data-act="cancelConfirm">Cancel</button>':'<button class="btn sm ghost" data-act="askReset">Forgot your password?</button>')+'</p></div></div>';
}
function gateWizard(){
  var st=ui.step,p=profile(),h='<div class="gate"><div class="gatecard" style="width:min(760px,100%)">'+stepsBar(4,st+1);
  if(st===0)h+='<div><span class="lab">Step 1 of 3</span><h2 class="lockup" style="font-size:clamp(28px,6vw,44px)">Your day,<span>from scratch</span></h2></div><p class="lead">Add the parts of your day one by one: waking up, school, study, breaks, meals, sleep, anything else. Nothing is pre-filled.</p><section class="card">'+routineEditor()+'</section>';
  else if(st===1)h+='<div><span class="lab">Step 2 of 3</span><h2 class="lockup" style="font-size:clamp(28px,6vw,44px)">Do you go<span>to coaching?</span></h2></div><p class="lead">Pick your days, then the exact times. It will be added to your day automatically.</p><section class="card">'+coachEditor()+'</section>';
  else h+='<div><span class="lab">Step 3 of 3</span><h2 class="lockup" style="font-size:clamp(28px,6vw,44px)">Reminders,<span>your way</span></h2></div><p class="lead">Choose what should nudge you. You can change all of this later in Settings.</p><section class="card">'+remindEditor()+'</section><p class="note">Medicines and health logs live in the Health tab. Add them there after this.</p>';
  h+='<div style="display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap">'+(st>0?'<button class="btn" data-act="stepBack">Back</button>':'<span></span>')+(st<2?'<button class="btn primary" data-act="stepNext">Next</button>':'<button class="btn primary" data-act="finish">Finish setup</button>')+'</div></div></div>';
  return h;
}

/* ---------- render ---------- */
var TABNAMES={today:'Today',plan:'Plan',health:'Health',stats:'Stats',rewards:'Rewards',settings:'Settings',coach:'Shared stats'};
function tabList(){return ['today','plan','health','stats','rewards','settings'];}
function metaHtml(){var h='';h+='<span class="pill" title="Where your data is stored">'+(sync==='db'?'Saved privately to your account':sync==='error'?'Save failed. Kept on this device':'Saved on this device only')+'</span>';h+='<span class="pill"><b id="clock">'+fmt12(nowMins())+'</b></span>';return h;}
function renderMeta(){var el=byId('meta');if(el)el.innerHTML=metaHtml();}
function render(){
  var root=byId('root'),s=ui.stage;
  if(s==='welcome')root.innerHTML=gateWelcome();
  else if(s==='pw')root.innerHTML=gatePw();
  else if(s==='lock')root.innerHTML=gateLock();
  else if(s==='wizard')root.innerHTML=gateWizard();
  else if(s==='app'){
    var tabs=tabList();if(tabs.indexOf(ui.tab)<0)ui.tab=tabs[0];
    var map={today:viewToday,plan:viewPlan,health:viewHealth,stats:viewStats,rewards:viewRewards,settings:viewSettings};
    root.innerHTML='<header class="top"><h1 class="lockup">Your day<span>Your pace</span></h1><div class="meta" id="meta">'+metaHtml()+'</div></header>'+
      '<nav class="tabs" role="tablist" aria-label="Sections">'+tabs.map(function(t){return '<button class="tab" role="tab" data-act="tab" data-tab="'+t+'" aria-selected="'+(ui.tab===t)+'">'+TABNAMES[t]+'</button>';}).join('')+'</nav>'+
      '<main id="view">'+map[ui.tab]()+'</main>';
  }else root.innerHTML='';
}
function softRender(){var a=document.activeElement;if(a&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&a.type!=='checkbox')||a.tagName==='SELECT'))return;render();}
function route(){
  if(ui.ownerOnly){ui.stage='app';return;}
  var p=profile();
  if(!p.pw){if(ui.stage!=='pw'&&ui.stage!=='welcome')ui.stage='welcome';return;}
  if(!ui.unlocked){ui.stage='lock';return;}
  if(!p.setup){if(ui.stage!=='wizard'){ui.stage='wizard';ui.step=0;}return;}
  ui.stage='app';
}

/* ---------- crypto ---------- */
function sha(s){
  try{if(window.crypto&&crypto.subtle&&window.TextEncoder)return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');});}catch(e){}
  var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return Promise.resolve('f'+(h>>>0).toString(16));
}

/* ---------- actions ---------- */
function editPlans(fn){var l=clone(plans());fn(l);putDoc('plans',{list:l});}
function editMeds(fn){var l=clone(meds());fn(l);putDoc('meds',{list:l});}
function findPlan(l,id){return l.filter(function(p){return p.id===id;})[0];}
function syncMedDraft(){var d=ui.medDraft;if(!d||!byId('m-n'))return;d.name=val('m-n');d.note=val('m-note');d.times=d.times.map(function(_,i){return val('m-t'+i);});}
function saveCoachTimes(){var c=clone(routine());var s=toMin(val('c-s')),e=toMin(val('c-e'));c.coach.s=s;c.coach.e=e;putDoc('routine',c);}
function setRoutine(fn){var r=clone(routine());fn(r);putDoc('routine',r);}
function downloadFile(name,data){
  if(!window.claude||!window.claude.use){toast('Saving files is not available here');return;}
  window.claude.use('downloads').then(function(dl){if(!dl){toast('Saving files is not available here');return;}
    return dl.save({filename:name,data:data}).then(function(){toast('Saved '+name);},function(e){if(e&&e.code!=='declined')toast('Could not save the file');});}).catch(function(){toast('Could not save the file');});
}
function exportJson(){var o={app:'daily-tracker',v:1,exported:new Date().toISOString(),docs:{}};Object.keys(cache).forEach(function(id){if(id==='profile')return;o.docs[id]=cache[id];});downloadFile('my-tracker-backup-'+todayKey()+'.json',JSON.stringify(o,null,2));}
function importFile(file){var fr=new FileReader();fr.onload=function(){try{var o=JSON.parse(String(fr.result));if(!o||typeof o.docs!=='object')throw 0;var n=0;Object.keys(o.docs).forEach(function(id){if(DOCIDS.test(id)&&id!=='profile'&&o.docs[id]&&typeof o.docs[id]==='object'){putDoc(id,o.docs[id]);n++;}});toast('Restored '+n+' '+plural(n,'item','items'));render();}catch(e){toast('That is not a tracker backup file');}};fr.onerror=function(){toast('Could not read that file');};fr.readAsText(file);}
function eraseAll(){
  Object.keys(cache).forEach(function(id){if(id==='profile')return;delete cache[id];lsDel(id);if(dbc)dbc.collection('data/users/'+myId).doc(id).delete().catch(function(){});});
  ver++;ui.confirm=null;toast('Your data was erased');render();scheduleShare();
}
function removeAlert(i){alerts.splice(i,1);renderAlerts();}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  if(el.tagName==='INPUT'||el.tagName==='SELECT')return;
  var a=el.getAttribute('data-act'),id=el.getAttribute('data-id'),k=ui.day,t=todayKey(),v=el.getAttribute('data-v');
  switch(a){
    case 'tab':ui.tab=el.getAttribute('data-tab');ui.confirm=null;break;
    case 'prevDay':ui.day=addDays(ui.day,-1);ui.edit=null;break;
    case 'nextDay':if(ui.day<t)ui.day=addDays(ui.day,1);ui.edit=null;break;
    case 'goToday':ui.day=t;ui.edit=null;break;
    case 'reroll':ui.qi=(ui.qi+1+Math.floor(Math.random()*(KIND.length-1)))%KIND.length;break;
    case 'setPri':{var keep={t:val('n-t'),due:val('n-due'),n:val('n-n')};ui.pri=v;render();if(byId('n-t')){byId('n-t').value=keep.t;byId('n-due').value=keep.due;byId('n-n').value=keep.n;}return;}
    case 'addTask':{var tx=val('n-t').trim();if(!tx){toast('Write the task first');return;}
      edit(k,function(d){d.tasks.push({id:uid(),t:tx.slice(0,140),p:ui.pri,due:toMin(val('n-due'))!=null?hhmm(toMin(val('n-due'))):'',n:val('n-n').trim().slice(0,300),done:false,at:null,bf:false});});toast('Task added');break;}
    case 'editTask':ui.edit='t:'+id;break;
    case 'cancelEdit':ui.edit=null;break;
    case 'saveTask':{var tx2=val('e-t').trim();if(!tx2){toast('The task needs a name');return;}
      edit(k,function(d){var x=d.tasks.filter(function(q){return q.id===id;})[0];if(x){x.t=tx2.slice(0,140);x.p=PRIS.indexOf(val('e-p'))>=0?val('e-p'):x.p;x.due=toMin(val('e-due'))!=null?hhmm(toMin(val('e-due'))):'';x.n=val('e-n').trim().slice(0,300);}});ui.edit=null;break;}
    case 'delTask':edit(k,function(d){d.tasks=d.tasks.filter(function(x){return x.id!==id;});});break;
    case 'moveTask':{var nk=addDays(k,1),mv=null;edit(k,function(d){mv=d.tasks.filter(function(x){return x.id===id;})[0];d.tasks=d.tasks.filter(function(x){return x.id!==id;});});
      if(mv){edit(nk,function(d){mv.done=false;mv.at=null;d.tasks.push(mv);});toast('Moved to '+dayLabel(nk));}break;}
    case 'dose':withLevel(function(){edit(k,function(d){var key=el.getAttribute('data-key');if(v==='clear')delete d.doses[key];else d.doses[key]={s:v,at:atStamp(k)};});});break;
    case 'checkin':withLevel(function(){edit(k,function(d){d.checkin=d.checkin?null:atStamp(k);});});break;
    case 'logEvent':{var f=el.getAttribute('data-f');edit(k,function(d){d[f].push(atStamp(k));});toast(f==='panic'?'Logged. You are doing the right thing by tracking it.':'Logged');break;}
    case 'undoEvent':{var f2=el.getAttribute('data-f');edit(k,function(d){d[f2].pop();});break;}
    case 'saveWeight':{var kg=parseFloat(val('w-kg'));if(!(kg>=20&&kg<=300)){toast('Enter a weight between 20 and 300 kg');return;}
      withLevel(function(){var e2=clone(weights());e2[weekKey(t)]={date:t,kg:Math.round(kg*10)/10};putDoc('weights',{e:e2});});toast('Weight saved');break;}
    case 'newMed':ui.medDraft={id:null,name:'',note:'',times:['']};break;
    case 'editMed':{var m=meds().filter(function(x){return x.id===id;})[0];if(m)ui.medDraft={id:m.id,name:m.name,note:m.note||'',times:m.times.slice(),since:m.since};break;}
    case 'delMed':editMeds(function(l){var i=l.map(function(x){return x.id;}).indexOf(id);if(i>=0)l.splice(i,1);});break;
    case 'medAddTime':syncMedDraft();ui.medDraft.times.push('');break;
    case 'medDelTime':syncMedDraft();ui.medDraft.times.splice(Number(el.getAttribute('data-i')),1);break;
    case 'cancelMed':ui.medDraft=null;break;
    case 'saveMed':{syncMedDraft();var d=ui.medDraft,nm2=d.name.trim();if(!nm2){toast('Give the medicine a name');return;}
      var tms=d.times.map(toMin);if(!tms.length||tms.some(function(x){return x==null;})){toast('Set a time for every dose');return;}
      var uniq=tms.filter(function(x,i){return tms.indexOf(x)===i;}).sort(function(a,b){return a-b;});
      var rec={id:d.id||uid(),name:nm2.slice(0,60),note:(d.note||'').trim().slice(0,80),times:uniq.map(hhmm),since:d.since||t};
      editMeds(function(l){var i=l.map(function(x){return x.id;}).indexOf(rec.id);if(i>=0)l[i]=rec;else l.push(rec);});ui.medDraft=null;toast('Medicine saved');break;}
    case 'addPlan':{var pt=val('pl-t').trim();if(!pt){toast('Name the plan first');return;}editPlans(function(l){l.unshift({id:uid(),t:pt.slice(0,80),due:val('pl-d')||'',sections:[]});});break;}
    case 'editPlan':ui.edit='p:'+id;break;
    case 'savePlan':{var ntl=val('pe-t').trim();if(!ntl){toast('The plan needs a name');return;}editPlans(function(l){var p=findPlan(l,id);if(p){p.t=ntl.slice(0,80);p.due=val('pe-d')||'';}});ui.edit=null;break;}
    case 'delPlan':editPlans(function(l){var i=l.map(function(x){return x.id;}).indexOf(id);if(i>=0)l.splice(i,1);});break;
    case 'addSect':{var pid=el.getAttribute('data-p'),st=val('ns-'+pid).trim();if(!st){toast('Name the section first');return;}editPlans(function(l){var p=findPlan(l,pid);if(p)p.sections.push({id:uid(),t:st.slice(0,80),items:[]});});break;}
    case 'delSect':{var pid2=el.getAttribute('data-p');editPlans(function(l){var p=findPlan(l,pid2);if(p)p.sections=p.sections.filter(function(s){return s.id!==id;});});break;}
    case 'addItem':{var pid3=el.getAttribute('data-p'),sid=el.getAttribute('data-s'),it=val('ni-'+sid).trim();if(!it){toast('Write the task first');return;}editPlans(function(l){var p=findPlan(l,pid3),s=p&&p.sections.filter(function(x){return x.id===sid;})[0];if(s)s.items.push({id:uid(),t:it.slice(0,140),done:false,at:null});});break;}
    case 'delItem':{var pid4=el.getAttribute('data-p'),sid2=el.getAttribute('data-s');editPlans(function(l){var p=findPlan(l,pid4),s=p&&p.sections.filter(function(x){return x.id===sid2;})[0];if(s)s.items=s.items.filter(function(x){return x.id!==id;});});break;}
    case 'period':ui.period=v;break;
    /* setup + auth */
    case 'begin':ui.stage='pw';ui.pwErr='';break;
    case 'setPw':{var p1=val('pw1'),p2=val('pw2');if(p1.length<4){ui.pwErr='Use at least 4 characters.';break;}if(p1!==p2){ui.pwErr='The two passwords do not match.';break;}
      var salt=uid();sha(salt+p1).then(function(hs){var p=clone(cache.profile||{});p.pw=hs;p.salt=salt;p.since=p.since||todayKey();putDoc('profile',p);ui.unlocked=true;ssSet('unlocked','1');ui.pwErr='';ui.stage='wizard';ui.step=0;render();});return;}
    case 'unlock':{var pr=profile();sha((pr.salt||'')+val('pw-in')).then(function(hs){if(hs===pr.pw){ui.unlocked=true;ssSet('unlocked','1');ui.pwErr='';route();}else ui.pwErr='That is not the right password.';render();});return;}
    case 'askReset':ui.confirm='reset';break;
    case 'resetPw':{var q=clone(cache.profile||{});q.pw=null;q.salt=null;putDoc('profile',q);ui.confirm=null;ui.stage='pw';ui.unlocked=false;break;}
    case 'stepNext':syncBform();ui.step=Math.min(2,ui.step+1);break;
    case 'stepBack':ui.step=Math.max(0,ui.step-1);break;
    case 'finish':{var pf=clone(cache.profile||{});pf.setup=true;putDoc('profile',pf);ui.stage='app';ui.tab='today';toast('All set. Welcome, '+profile().name);break;}
    case 'ownerView':ui.ownerOnly=true;ui.tab='coach';ui.stage='app';break;
    case 'exitOwner':ui.ownerOnly=false;ui.tab='today';route();break;
    /* routine editor */
    case 'bday':{syncBform();var dd=Number(el.getAttribute('data-d')),ix=ui.bform.days.indexOf(dd);if(ix>=0)ui.bform.days.splice(ix,1);else ui.bform.days.push(dd);break;}
    case 'quickName':syncBform();ui.bform.name=v;break;
    case 'addBlock':{syncBform();var f3=ui.bform,s1=toMin(f3.s),e1=toMin(f3.e);
      if(!f3.name.trim()){toast('Name this part of your day');return;}if(s1==null||e1==null){toast('Set a start and end time');return;}if(s1===e1){toast('Start and end cannot be the same');return;}if(!f3.days.length){toast('Pick at least one day');return;}
      var blk={id:f3.id||uid(),name:f3.name.trim().slice(0,60),s:s1,e:e1,days:f3.days.slice().sort(),remind:!!f3.remind};
      setRoutine(function(r){var i=r.blocks.map(function(x){return x.id;}).indexOf(blk.id);if(i>=0)r.blocks[i]=blk;else r.blocks.push(blk);});resetBform();toast('Added to your day');break;}
    case 'editBlock':{var b=routine().blocks.filter(function(x){return x.id===id;})[0];if(b){ui.bform={id:b.id,name:b.name,s:hhmm(b.s),e:hhmm(b.e),days:b.days.slice(),remind:!!b.remind};}break;}
    case 'delBlock':setRoutine(function(r){r.blocks=r.blocks.filter(function(x){return x.id!==id;});});if(ui.bform.id===id)resetBform();break;
    case 'cancelBform':resetBform();break;
    case 'coachMode':setRoutine(function(r){r.coach.mode=v;if(v==='none'){r.coach.s=null;r.coach.e=null;}});break;
    case 'enableBrowser':{if(!window.Notification){toast('Not available here');return;}Notification.requestPermission().then(function(r){var p=clone(cache.profile||{});p.notif=Object.assign({},profile().notif,{browser:r==='granted'});putDoc('profile',p);render();}).catch(function(){});return;}
    case 'saveName':{var nn=val('p-name').trim();if(!nn){toast('Your name cannot be empty');return;}var pn=clone(cache.profile||{});pn.name=nn.slice(0,40);putDoc('profile',pn);toast('Saved');break;}
    case 'savePw':{var po=val('pw-old'),pnw=val('pw-new'),pr2=profile();if(pnw.length<4){ui.pwMsg='The new password needs at least 4 characters.';break;}
      sha((pr2.salt||'')+po).then(function(hs){if(hs!==pr2.pw){ui.pwMsg='The current password is not right.';render();return;}var salt2=uid();return sha(salt2+pnw).then(function(h2){var p=clone(cache.profile||{});p.pw=h2;p.salt=salt2;putDoc('profile',p);ui.pwMsg='Password changed.';render();});});return;}
    case 'expJson':exportJson();return;
    case 'erase':ui.confirm='erase';break;
    case 'eraseGo':eraseAll();return;
    case 'cancelConfirm':ui.confirm=null;break;
    case 'alTaken':{var al=alerts[Number(el.getAttribute('data-i'))];if(al&&al.med){withLevel(function(){edit(t,function(d){d.doses[al.med]={s:'taken',at:new Date().toISOString()};});});removeAlert(Number(el.getAttribute('data-i')));}break;}
    case 'alSnooze':{var i2=Number(el.getAttribute('data-i')),a2=alerts[i2];if(a2){snoozed[a2.id]=Date.now()+profile().notif.snooze*60000;}removeAlert(i2);toast('Snoozed');return;}
    case 'alDismiss':removeAlert(Number(el.getAttribute('data-i')));return;
    default:return;
  }
  render();
});
document.addEventListener('change',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;var a=el.getAttribute('data-act'),k=ui.day,t=todayKey(),id=el.getAttribute('data-id');
  switch(a){
    case 'tickTask':withLevel(function(){edit(k,function(d){var x=d.tasks.filter(function(q){return q.id===id;})[0];if(x){x.done=el.checked;x.at=el.checked?atStamp(k):null;x.bf=el.checked&&k!==t;}});});break;
    case 'tickBlock':withLevel(function(){edit(k,function(d){if(el.checked)d.blk[id]={at:atStamp(k),bf:k!==t};else delete d.blk[id];});});break;
    case 'tickItem':{var pid=el.getAttribute('data-p'),sid=el.getAttribute('data-s');withLevel(function(){editPlans(function(l){var p=findPlan(l,pid),s=p&&p.sections.filter(function(x){return x.id===sid;})[0],it=s&&s.items.filter(function(x){return x.id===id;})[0];if(it){it.done=el.checked;it.at=el.checked?new Date().toISOString():null;}});});break;}
    case 'setGoal':{var p=clone(cache.profile||{});p.weeklyGoal=Number(el.value);putDoc('profile',p);break;}
    case 'nToggle':{var p2=clone(cache.profile||{});p2.notif=Object.assign({},profile().notif);p2.notif[el.getAttribute('data-k')]=el.checked;putDoc('profile',p2);break;}
    case 'nLead':case 'nSnooze':{var p3=clone(cache.profile||{});p3.notif=Object.assign({},profile().notif);p3.notif[a==='nLead'?'lead':'snooze']=Number(el.value);putDoc('profile',p3);break;}
    case 'coachTime':saveCoachTimes();return;
    case 'coachRemind':setRoutine(function(r){r.coach.remind=el.checked;});break;
    case 'import':if(el.files&&el.files[0])importFile(el.files[0]);return;
    default:return;
  }
  render();
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'||!e.target||e.target.tagName!=='INPUT')return;
  var id=e.target.id,map={'pw-in':'unlock','pw2':'setPw','n-t':'addTask','pl-t':'addPlan'};
  var act=map[id];if(!act&&/^ni-/.test(id))act='addItem';if(!act&&/^ns-/.test(id))act='addSect';if(!act)return;
  var btn=document.querySelector(act==='addItem'?'[data-act="addItem"][data-s="'+id.slice(3)+'"]':act==='addSect'?'[data-act="addSect"][data-p="'+id.slice(3)+'"]':'[data-act="'+act+'"]');if(btn){e.preventDefault();btn.click();}
});

/* ---------- boot ---------- */
loadLocal();
ui.unlocked=ssGet('unlocked')==='1';
route();render();initDb();
setInterval(function(){var c=byId('clock');if(c)c.textContent=fmt12(nowMins());tickAlerts();},15000);
setInterval(function(){if(ui.stage==='app'&&(ui.tab==='today')&&ui.edit===null&&ui.day===todayKey())softRender();},60000);
setTimeout(tickAlerts,1500);
})();
